<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="prism-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030A" />
      <stop offset="50%" stop-color="#0E0A1A" />
      <stop offset="100%" stop-color="#030206" />
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="33%" stop-color="#8B5CF6" />
      <stop offset="66%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="prism-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#05030A" stop-opacity="0" />
    </radialGradient>
    <pattern id="prism-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#prism-bg)" />
  <rect width="1200" height="420" fill="url(#prism-glow)" />
  <rect width="1200" height="420" fill="url(#prism-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.2" />

  <!-- Optical Prism Refraction Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- White Incoming Laser Ray -->
    <line x1="-160" y1="20" x2="-25" y2="0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <circle cx="-160" cy="20" r="4" fill="#FFFFFF" />

    <!-- Optical Triangular Prism -->
    <polygon points="0,-90 65,55 -65,55" fill="#130C26" stroke="#8B5CF6" stroke-width="2.5" />
    <polygon points="0,-75 52,45 -52,45" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6" />

    <!-- Refracted Rainbow Data Spectrum Rays -->
    <line x1="25" y1="5" x2="150" y2="-60" stroke="#EC4899" stroke-width="3" />
    <line x1="30" y1="15" x2="160" y2="-20" stroke="#8B5CF6" stroke-width="3" />
    <line x1="35" y1="25" x2="165" y2="20" stroke="#06B6D4" stroke-width="3" />
    <line x1="40" y1="35" x2="155" y2="60" stroke="#10B981" stroke-width="3" />

    <!-- HTTP Verb Indicator Tags on Rays -->
    <g transform="translate(130, -75)">
      <rect x="-25" y="-12" width="50" height="24" rx="4" fill="#170720" stroke="#EC4899" stroke-width="1" />
      <text x="0" y="4" fill="#EC4899" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">DEL 204</text>
    </g>
    <g transform="translate(145, -35)">
      <rect x="-25" y="-12" width="50" height="24" rx="4" fill="#100A24" stroke="#8B5CF6" stroke-width="1" />
      <text x="0" y="4" fill="#8B5CF6" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">PUT 200</text>
    </g>
    <g transform="translate(150, 5)">
      <rect x="-28" y="-12" width="56" height="24" rx="4" fill="#061A22" stroke="#06B6D4" stroke-width="1" />
      <text x="0" y="4" fill="#06B6D4" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">POST 201</text>
    </g>
    <g transform="translate(135, 45)">
      <rect x="-25" y="-12" width="50" height="24" rx="4" fill="#071E15" stroke="#10B981" stroke-width="1" />
      <text x="0" y="4" fill="#10B981" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">GET 200</text>
    </g>

    <text x="0" y="115" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">OPTICAL REFRACTION: ZERO LATENCY</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="230" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#8B5CF6" />
    <text x="28" y="19" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">API TESTING WORKBENCH</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Prismarine
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#spectrum)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Fast, local-first API testing and debugging workbench built with Next.js and Bun.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Zero mandatory cloud accounts or subscription paywalls. Full Postman alternative.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">ENGINE: BUN 1.0+</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">UI: NEXT.JS + ZUSTAND</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>